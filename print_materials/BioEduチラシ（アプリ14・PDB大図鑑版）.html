<html lang="ja">
<head>

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap');

        /* ========================================================
           👨‍🏫 先生用：文字サイズ・余白の手動カスタマイズ設定
           ここの数値を書き換えるだけで、全体のバランスが変化します！
           ======================================================== */
        :root {
            /* 1. 【表面】アプリ一覧の設定 */
            --app-title-size: 14.5px;    /* アプリ名の大きさ */
            --app-desc-size: 10.5px;     /* アプリの説明文の大きさ */
            --app-card-padding: 16px;    /* カード内側の余白 */
            --app-grid-gap: 16px;        /* カード同士の隙間 */

            /* 2. 【裏面】PDB図鑑の設定 */
            --pdb-title-size: 9.5px;     /* 分子名の大きさ */
            --pdb-desc-size: 8px;        /* 分子の説明文の大きさ */
            --pdb-id-size: 9px;          /* PDB IDの大きさ */
            --pdb-item-gap: 8px;         /* 分子と分子の間の隙間 */
            --pdb-category-gap: 10px;    /* カテゴリと分子の隙間 */
        }
        /* ======================================================== */

        body { font-family: 'Noto Sans JP', sans-serif; background-color: #e2e8f0; margin: 0; }
        .font-mono-code { font-family: 'Fira Code', monospace; }
        
        /* カスタム変数の適用クラス（表面） */
        .app-title { font-size: var(--app-title-size); }
        .app-desc { font-size: var(--app-desc-size); }
        .app-card { padding: var(--app-card-padding); }
        .app-grid { gap: var(--app-grid-gap); }

        /* カスタム変数の適用クラス（裏面） */
        .custom-title { font-size: var(--pdb-title-size); line-height: 1.15; }
        .custom-desc { font-size: var(--pdb-desc-size); line-height: 1.25; margin-top: 3px; }
        .custom-id { font-size: var(--pdb-id-size); }
        .custom-list { display: flex; flex-direction: column; gap: var(--pdb-item-gap); }
        .custom-col { display: flex; flex-direction: column; gap: var(--pdb-category-gap); justify-content: flex-start; height: 100%; }

        /* 🔥 A4用紙（縦）の完璧な両面印刷設定（王道の実寸100%指定） */
        @media print {
            body, html { 
                background-color: white !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 210mm !important; 
                height: 297mm !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            .no-print { display: none !important; }
            @page { size: A4 portrait; margin: 0; }
            
            .print-wrapper { 
                display: block !important; 
                width: 210mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }
            
            .print-container { 
                width: 210mm !important; 
                height: 297mm !important; 
                box-sizing: border-box !important;
                box-shadow: none !important; 
                margin: 0 !important; 
                padding: 0 !important;
                border: none !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                overflow: hidden !important;
                transform: none !important; /* scale処理を全廃止し実寸描画 */
            }
            .print-container:last-child {
                page-break-after: auto !important;
            }
        }

        /* 画面プレビュー用のスタイル */
        @media screen {
            .print-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
                padding: 2rem 0;
            }
            .print-container {
                width: 210mm;
                height: 297mm;
                background-color: white;
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
                border-radius: 4px;
                overflow: hidden;
                position: relative;
            }
        }
        
        /* タイトルの「が」が改行されないようにする */
        .no-break { display: inline-block; }
    </style>
</head>
