<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Edu 形態進化デジタルラボ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f1f5f9; margin: 0; overflow: hidden; }
        .font-mono-code { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* ツールチップ用のスタイル */
        .tooltip .tooltiptext {
            visibility: hidden;
            width: max-content;
            background-color: #334155;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 100;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
            line-height: 1.5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent #334155 transparent;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SPECIES_LIST = [
            { id: "chicken", name: "ニワトリ", skfbId: "6U8nX", isExp: true }, // Placeholder if not found, or use real data
            { id: "gull", name: "カモメ", skfbId: "2348d098aa4f4b2085099d879be5c184" },
            { id: "bat", name: "コウモリ", skfbId: "bf93df599637419bbb62eb6183986621" },
            { id: "whale", name: "ザトウクジラ", skfbId: "1d679f0772ce44d48af1ddda23e5e75f" },
            { id: "donkey", name: "ロバ", skfbId: "1fd9b59fe7a04c2f8501e0bb6817a568" },
            { id: "human", name: "ヒト", skfbId: "403c587652d34fa19100ea9dcb4e90a1", isBase: true },
            { id: "salamander", name: "オオサンショウウオ", skfbId: "fd581e6dd0c04e9b88a44e75fd3da959", isOutgroup: true }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState(SPECIES_LIST[1]); // カモメを初期値に（ニワトリの3Dがない場合を考慮）
            const [measurements, setMeasurements] = useState({});
            const [copyRawStatus, setCopyRawStatus] = useState("① 実測値をコピー (提出用)");
            const [copyCsvStatus, setCopyCsvStatus] = useState("② アプリ用CSVをコピー (解析用)");
            const [isFullscreen, setIsFullscreen] = useState(false);
            const appContainerRef = useRef(null);

            useEffect(() => {
                const initialData = {};
                SPECIES_LIST.forEach(s => {
                    initialData[s.name] = { fore: "", meta: "", phal: "" };
                });
                initialData["ヒト(自分の腕)"] = { fore: "", meta: "", phal: "" };
                setMeasurements(initialData);

                // フルスクリーン変更イベントのリスナーを追加
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            const handleInput = (speciesName, field, value) => {
                setMeasurements(prev => ({
                    ...prev,
                    [speciesName]: { ...prev[speciesName], [field]: value }
                }));
            };

            // アプリ全体の全画面表示切り替え
            const toggleAppFullScreen = () => {
                if (!document.fullscreenElement) {
                    if (appContainerRef.current.requestFullscreen) {
                        appContainerRef.current.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            // 1. 実測値のみをコピー（スプレッドシートへの個別提出用）
            const handleCopyRawData = () => {
                let text = "種名,前腕(実測),手根・中手骨(実測),指骨(実測)\n";
                SPECIES_LIST.forEach(s => {
                    const data = measurements[s.name] || {};
                    text += `${s.name},${data.fore || ""},${data.meta || ""},${data.phal || ""}\n`;
                });
                const myData = measurements["ヒト(自分の腕)"] || {};
                text += `ヒト(自分の腕),${myData.fore || ""},${myData.meta || ""},${myData.phal || ""}\n`;

                navigator.clipboard.writeText(text).then(() => {
                    setCopyRawStatus("✅ コピーしました！");
                    setTimeout(() => setCopyRawStatus("① 実測値をコピー (提出用)"), 3000);
                });
            };

            // 2. 調整済みの個別CSVをコピー（アプリ10 ダッシュボードへの直接貼り付け用）
            const handleCopyAppCSV = () => {
                let csv = "";
                SPECIES_LIST.forEach(s => {
                    const data = measurements[s.name] || {};
                    const fore = parseFloat(data.fore);
                    const meta = parseFloat(data.meta);
                    const phal = parseFloat(data.phal);

                    if (!isNaN(fore) && !isNaN(meta) && !isNaN(phal) && fore > 0) {
                        const ratioFore = "100.0";
                        const ratioMeta = ((meta / fore) * 100).toFixed(1);
                        const ratioPhal = ((phal / fore) * 100).toFixed(1);
                        csv += `${s.name},${ratioFore},${ratioMeta},${ratioPhal}\n`;
                    }
                });

                if (csv === "") {
                    setCopyCsvStatus("⚠️ データを入力してください");
                    setTimeout(() => setCopyCsvStatus("② アプリ用CSVをコピー (解析用)"), 3000);
                    return;
                }

                navigator.clipboard.writeText(csv).then(() => {
                    setCopyCsvStatus("✅ アプリ用CSVコピー完了！");
                    setTimeout(() => setCopyCsvStatus("② アプリ用CSVをコピー (解析用)"), 3000);
                });
            };

            return (
                <div ref={appContainerRef} className="h-screen flex flex-col bg-slate-100">
                    {/* ヘッダー */}
                    <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shrink-0 shadow-md relative z-20">
                        <div className="flex items-center gap-3">
                            <i data-lucide="microscope" className="w-6 h-6 text-amber-400"></i>
                            <div>
                                <h1 className="text-xl font-black tracking-tight leading-none text-transparent bg-clip-text bg-gradient-to-r from-white to-amber-200">形態進化 デジタル・ラボ</h1>
                                <p className="text-[10px] text-slate-400 font-mono-code tracking-widest mt-0.5">Bio-Edu Interactive Workspace</p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            {/* スクショ方法のツールチップ */}
                            <div className="tooltip relative flex items-center justify-center cursor-help">
                                <div className="text-xs text-amber-200 bg-amber-900/40 border border-amber-500/30 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-bold hover:bg-amber-800/60 transition-colors">
                                    <i data-lucide="camera" className="w-4 h-4"></i>
                                    スクショの撮り方ガイド
                                </div>
                                <div className="tooltiptext">
                                    <div className="font-bold border-b border-slate-500 pb-1 mb-2">📸 スクリーンショットの撮り方</div>
                                    <ul className="list-disc pl-4 space-y-1">
                                        <li><span className="text-sky-300 font-bold">iPad:</span> トップボタン ＋ 音量ボタンを同時に押す</li>
                                        <li><span className="text-green-300 font-bold">Chromebook:</span> Ctrl ＋ 「ウィンドウを表示」キー</li>
                                        <li><span className="text-blue-300 font-bold">Windows:</span> Windowsロゴキー ＋ Shift ＋ S</li>
                                        <li><span className="text-gray-300 font-bold">Mac:</span> Command ＋ Shift ＋ 3 (または4)</li>
                                        <li><span className="text-emerald-300 font-bold">Android:</span> 電源ボタン ＋ 音量下ボタンを同時に長押し</li>
                                    </ul>
                                </div>
                            </div>
                            
                            {/* アプリ全体の全画面ボタン */}
                            <button
                                onClick={toggleAppFullScreen}
                                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-[11px] font-bold rounded border border-slate-600 flex items-center gap-1.5 transition-all shadow"
                                title="アプリ全体を全画面表示にして作業しやすくします"
                            >
                                {isFullscreen ? <i data-lucide="minimize" className="w-3.5 h-3.5"></i> : <i data-lucide="maximize" className="w-3.5 h-3.5"></i>}
                                {isFullscreen ? "全画面を解除" : "左右並べて全画面表示"}
                            </button>
                        </div>
                    </header>

                    {/* メイン画面 */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* 左カラム：リファレンス ＆ ワークシート */}
                        <div className="w-[45%] h-full flex flex-col bg-slate-50 border-r border-slate-300 shadow-[5px_0_15px_rgba(0,0,0,0.05)] relative z-10 overflow-y-auto">
                            
                            <div className="p-4 pb-2 shrink-0">
                                <div className="flex items-center gap-2 mb-2 border-b-2 border-slate-200 pb-1.5">
                                    <div className="w-5 h-5 bg-indigo-500 text-white rounded flex items-center justify-center font-black text-xs">1</div>
                                    <h2 className="text-[14px] font-bold text-slate-800">カラーコードと部位の確認 (3Dリファレンス)</h2>
                                </div>
                                
                                <div className="flex gap-3 h-[180px]">
                                    {/* 凡例 */}
                                    <div className="w-1/3 bg-white border border-slate-200 rounded-lg p-2.5 flex flex-col justify-center gap-2.5 shadow-sm">
                                        <div className="flex items-center gap-1.5">
                                            <div className="w-4 h-4 rounded bg-[#3b82f6] shrink-0 border border-slate-300"></div>
                                            <div className="text-[11px] font-bold text-slate-700 leading-tight">上腕骨 <span className="font-mono-code text-[9px] text-slate-400 block">Humerus</span></div>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <div className="w-4 h-4 rounded bg-[#bef264] shrink-0 border border-slate-300"></div>
                                            <div className="text-[11px] font-bold text-slate-700 leading-tight">①橈骨 (前腕) <span className="font-mono-code text-[9px] text-slate-400 block">Radius</span></div>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <div className="w-4 h-4 rounded bg-[#93c5fd] shrink-0 border border-slate-300"></div>
                                            <div className="text-[11px] font-bold text-slate-700 leading-tight">①尺骨 (前腕) <span className="font-mono-code text-[9px] text-slate-400 block">Ulna</span></div>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <div className="w-4 h-4 rounded bg-[#fb7185] shrink-0 border border-slate-300"></div>
                                            <div className="text-[11px] font-bold text-slate-700 leading-tight">②手根骨 <span className="font-mono-code text-[9px] text-slate-400 block">Carpals</span></div>
                                        </div>
                                        <div className="flex items-start gap-1.5">
                                            <div className="w-4 h-4 rounded bg-[#fbcfe8] shrink-0 border border-slate-300 mt-0.5"></div>
                                            <div className="text-[11px] font-bold text-slate-700 leading-tight">③中手骨＋指骨 <span className="font-mono-code text-[9px] text-slate-400 block">Digits</span></div>
                                        </div>
                                    </div>
                                    
                                    {/* 3D埋め込み（色確認用ヒト） */}
                                    <div className="w-2/3 bg-slate-900 rounded-lg border border-slate-700 relative flex justify-center items-center shadow-inner overflow-hidden">
                                        <div className="absolute top-2 left-2 z-20 bg-black/60 backdrop-blur-sm text-slate-200 text-[9px] font-bold px-2 py-1 rounded">
                                            色の確認用（ヒト）
                                        </div>
                                        <iframe 
                                            title="Human Arm Legend" 
                                            src={`https://sketchfab.com/models/403c587652d34fa19100ea9dcb4e90a1/embed?autostart=1&ui_infos=0&ui_watermark=0&ui_stop=0`}
                                            className="w-full h-full absolute inset-0 border-none z-10"
                                            allow="autoplay; fullscreen; xr-spatial-tracking"
                                        ></iframe>
                                    </div>
                                </div>
                            </div>

                            {/* ② ワークシート */}
                            <div className="p-4 pt-0 flex-1 flex flex-col">
                                <div className="flex justify-between items-end mb-2 border-b-2 border-slate-200 pb-1.5">
                                    <div className="flex items-center gap-2">
                                        <div className="w-5 h-5 bg-emerald-500 text-white rounded flex items-center justify-center font-black text-xs">2</div>
                                        <h2 className="text-[14px] font-bold text-slate-800">計測ワークシート (単位: mm)</h2>
                                    </div>
                                    <span className="text-[10px] text-slate-500 font-bold bg-slate-200 px-2 py-0.5 rounded">※小数点第一位まで</span>
                                </div>

                                <div className="bg-white border border-slate-300 rounded-lg shadow-sm overflow-hidden flex-1 flex flex-col">
                                    <div className="overflow-y-auto flex-1">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-100 text-slate-600 sticky top-0 z-10 text-[11px] border-b border-slate-300">
                                                <tr>
                                                    <th className="px-3 py-2 font-bold w-[35%]">生物名</th>
                                                    <th className="px-2 py-2 font-bold text-center">① 前腕 <br/><span className="text-[9px] font-normal text-slate-400">黄緑/水色</span></th>
                                                    <th className="px-2 py-2 font-bold text-center">② 手根・中手骨 <br/><span className="text-[9px] font-normal text-slate-400">濃桃〜薄桃根元</span></th>
                                                    <th className="px-2 py-2 font-bold text-center">③ 指骨(最長) <br/><span className="text-[9px] font-normal text-slate-400">薄桃</span></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {SPECIES_LIST.map((species, idx) => (
                                                    <tr key={species.id} className={`border-b border-slate-100 hover:bg-emerald-50/50 transition-colors ${species.isBase ? 'bg-indigo-50/30' : ''}`}>
                                                        <td className="px-3 py-2.5 flex items-center gap-1.5">
                                                            <div className="font-bold text-slate-800 text-[12px]">{species.name}</div>
                                                            {species.isExp && <span className="text-[9px] bg-amber-100 text-amber-700 px-1 rounded border border-amber-200">実験</span>}
                                                            {species.isBase && <span className="text-[9px] bg-indigo-100 text-indigo-700 px-1 rounded border border-indigo-200">基準</span>}
                                                            {species.isOutgroup && <span className="text-[9px] bg-slate-200 text-slate-600 px-1 rounded border border-slate-300">外群</span>}
                                                        </td>
                                                        <td className="px-2 py-1.5">
                                                            <input type="number" step="0.1" value={measurements[species.name]?.fore || ""} onChange={(e) => handleInput(species.name, 'fore', e.target.value)}
                                                                className="w-full bg-slate-50 border border-slate-300 text-slate-800 text-center text-sm rounded focus:ring-2 focus:ring-emerald-400 focus:outline-none py-1 transition-all" placeholder="-" />
                                                        </td>
                                                        <td className="px-2 py-1.5">
                                                            <input type="number" step="0.1" value={measurements[species.name]?.meta || ""} onChange={(e) => handleInput(species.name, 'meta', e.target.value)}
                                                                className="w-full bg-slate-50 border border-slate-300 text-slate-800 text-center text-sm rounded focus:ring-2 focus:ring-emerald-400 focus:outline-none py-1 transition-all" placeholder="-" />
                                                        </td>
                                                        <td className="px-2 py-1.5">
                                                            <input type="number" step="0.1" value={measurements[species.name]?.phal || ""} onChange={(e) => handleInput(species.name, 'phal', e.target.value)}
                                                                className="w-full bg-slate-50 border border-slate-300 text-slate-800 text-center text-sm rounded focus:ring-2 focus:ring-emerald-400 focus:outline-none py-1 transition-all" placeholder="-" />
                                                        </td>
                                                    </tr>
                                                ))}
                                                <tr className="bg-amber-50/50 border-t-2 border-dashed border-amber-200">
                                                    <td className="px-3 py-2.5 text-[11px] font-bold text-amber-800 flex items-center gap-1"><i data-lucide="user" className="w-3 h-3"></i>ヒト(自分の腕)</td>
                                                    <td className="px-2 py-1.5">
                                                        <input type="number" step="0.1" value={measurements["ヒト(自分の腕)"]?.fore || ""} onChange={(e) => handleInput("ヒト(自分の腕)", 'fore', e.target.value)}
                                                            className="w-full bg-white border border-amber-300 text-amber-900 text-center text-sm rounded focus:outline-none py-1" placeholder="メモ" />
                                                    </td>
                                                    <td className="px-2 py-1.5">
                                                        <input type="number" step="0.1" value={measurements["ヒト(自分の腕)"]?.meta || ""} onChange={(e) => handleInput("ヒト(自分の腕)", 'meta', e.target.value)}
                                                            className="w-full bg-white border border-amber-300 text-amber-900 text-center text-sm rounded focus:outline-none py-1" placeholder="メモ" />
                                                    </td>
                                                    <td className="px-2 py-1.5">
                                                        <input type="number" step="0.1" value={measurements["ヒト(自分の腕)"]?.phal || ""} onChange={(e) => handleInput("ヒト(自分の腕)", 'phal', e.target.value)}
                                                            className="w-full bg-white border border-amber-300 text-amber-900 text-center text-sm rounded focus:outline-none py-1" placeholder="メモ" />
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    <div className="p-3 bg-slate-100 border-t border-slate-200">
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={handleCopyRawData}
                                                className="w-1/2 py-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-bold rounded shadow-sm flex flex-col justify-center items-center transition-all transform active:scale-95"
                                            >
                                                <span className="text-xs">{copyRawStatus}</span>
                                                <span className="text-[9px] text-slate-500 font-normal mt-0.5">※スプレッドシート用</span>
                                            </button>
                                            
                                            <button 
                                                onClick={handleCopyAppCSV}
                                                className="w-1/2 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded shadow-md flex flex-col justify-center items-center transition-all transform active:scale-95"
                                            >
                                                <span className="text-xs">{copyCsvStatus}</span>
                                                <span className="text-[9px] text-emerald-100 font-normal mt-0.5">※個人のまま解析する用</span>
                                            </button>
                                        </div>
                                        <div className="text-center mt-2.5">
                                            <a href="https://katsumasashibata.github.io/Bio-Edu-Suite/index.html" target="_blank" rel="noopener noreferrer" className="text-[11px] text-emerald-600 font-bold hover:underline inline-flex items-center gap-1">
                                                <i data-lucide="external-link" className="w-3 h-3"></i>Bio-Edu ダッシュボードを開く
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 右カラム：3Dビューア空間 */}
                        <div className="w-[55%] bg-[#1a1a1a] flex flex-col relative">
                            
                            {/* タブ切り替え */}
                            <div className="bg-[#2a2a2a] p-2 flex flex-wrap gap-1.5 shadow-md relative z-10 shrink-0 border-b border-[#3a3a3a]">
                                {SPECIES_LIST.map(species => (
                                    <button
                                        key={species.id}
                                        onClick={() => setActiveTab(species)}
                                        className={`px-2.5 py-1.5 text-[11px] font-bold rounded transition-all flex items-center gap-1 ${
                                            activeTab.id === species.id 
                                            ? 'bg-emerald-500 text-white shadow-[0_0_10px_rgba(16,185,129,0.5)] border border-emerald-400' 
                                            : 'bg-[#1f1f1f] text-slate-400 hover:bg-[#333] hover:text-slate-200 border border-[#3a3a3a]'
                                        }`}
                                    >
                                        {species.name}
                                    </button>
                                ))}
                            </div>

                            <div className="absolute top-14 left-4 z-10 bg-black/60 backdrop-blur-sm text-emerald-300 text-[10px] font-bold px-3 py-1.5 rounded-full border border-emerald-500/30 flex items-center gap-1.5 pointer-events-none">
                                <i data-lucide="alert-circle" className="w-3.5 h-3.5"></i>
                                {isFullscreen ? "※画面上のガイドを見てスクショを撮ろう" : "※右下のボタンか上部のボタンで全画面にしよう"}
                            </div>

                            <div className="flex-1 w-full h-full bg-black relative">
                                <iframe 
                                    key={activeTab.skfbId}
                                    title="Sketchfab Viewer" 
                                    src={`https://sketchfab.com/models/${activeTab.skfbId}/embed?autostart=1&ui_infos=0&ui_watermark=0&ui_stop=0`}
                                    className="w-full h-full absolute inset-0 border-none"
                                    allow="autoplay; fullscreen; xr-spatial-tracking"
                                ></iframe>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => { lucide.createIcons(); }, 500);
    </script>
</body>
</html>
