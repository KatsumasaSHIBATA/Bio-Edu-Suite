<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Edu Suite Reference Sheet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap');
        
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
        .font-mono-code { font-family: 'Fira Code', monospace; }
        
        /* 🔥 A4用紙（縦）の完璧な印刷設定（王道の実寸100%指定） */
        @media print {
            body, html { 
                background-color: white !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 210mm !important; 
                height: 297mm !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            .no-print { display: none !important; }
            
            @page { size: A4 portrait; margin: 0; }
            
            .print-wrapper { 
                display: block !important; 
                width: 210mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }
            
            .print-container { 
                width: 210mm !important; 
                height: 297mm !important; 
                box-sizing: border-box !important;
                box-shadow: none !important;
                margin: 0 !important; 
                padding: 0 !important;
                border: none !important;
                page-break-after: always !important; /* ページ分割 */
                page-break-inside: avoid !important;
                overflow: hidden !important;
                transform: none !important; /* scale処理を全廃止し実寸描画 */
            }
            .print-container:last-child {
                page-break-after: auto !important;
            }
        }

        /* 画面プレビュー用のスタイル */
        @media screen {
            .print-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
                padding: 2rem 0;
            }
            .print-container {
                width: 210mm;
                height: 297mm;
                background-color: white;
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
                border-radius: 4px;
                overflow: hidden;
                position: relative;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div className="min-h-screen bg-slate-50 print-wrapper flex flex-col items-center pb-10">
                    
                    {/* 🖨️ 画面用コントロール（印刷設定の注意喚起を追加） */}
                    <div className="no-print w-full bg-white p-4 shadow-sm flex flex-col justify-center items-center sticky top-0 z-50 border-b border-slate-200">
                        <button 
                            onClick={() => window.print()}
                            className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-emerald-500/20 flex items-center gap-2 transition-all transform hover:scale-105 border border-emerald-400/30"
                        >
                            <i data-lucide="printer" className="w-5 h-5"></i>
                            A4サイズで印刷する
                        </button>
                        <p className="text-amber-500 font-bold text-[13px] mt-3 flex items-center gap-1.5 bg-amber-50 px-4 py-1.5 rounded-full border border-amber-200 shadow-sm">
                            <i data-lucide="alert-triangle" className="w-4 h-4"></i>
                            綺麗に印刷するコツ：印刷ダイアログの設定で「用紙サイズ：A4」「余白：なし」「倍率：既定（100%）」を選んでください。
                        </p>
                    </div>

                    {/* 📄 チラシキャンバス（A4サイズ固定） */}
                    <div className="py-6 print-wrapper w-full flex md:justify-center">
                        <div className="print-container w-[210mm] h-[297mm] bg-white shadow-xl rounded-sm relative flex flex-col box-border border border-slate-200/80">
                            
                            {/* 🟦 ヘッダーセクション */}
                            <header className="bg-slate-900 text-white p-4 relative shadow-md overflow-hidden shrink-0 border-b-4 border-emerald-500">
                                {/* 背景の装飾エフェクト */}
                                <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500 rounded-full mix-blend-screen filter blur-3xl opacity-20 -translate-y-1/2 translate-x-1/3"></div>
                                <div className="absolute bottom-0 left-0 w-48 h-48 bg-teal-500 rounded-full mix-blend-screen filter blur-3xl opacity-20 translate-y-1/2 -translate-x-1/4"></div>
                                <div className="absolute right-10 bottom-0 opacity-10 font-mono-code text-5xl font-black rotate-12 pointer-events-none select-none">CODE</div>
                                
                                <div className="relative z-10 flex justify-between items-end">
                                    <div>
                                        <div className="flex items-center gap-1.5 mb-1">
                                            <i data-lucide="book-open" className="w-4.5 h-4.5 text-emerald-400"></i>
                                            <span className="text-emerald-300 font-bold tracking-widest text-[9px] border border-emerald-400/30 px-1.5 py-0.5 rounded bg-emerald-900/40">BIO-EDU SUITE REFERENCE</span>
                                        </div>
                                        <h1 className="text-2xl leading-none font-black tracking-tighter mb-1.5 text-transparent bg-clip-text bg-gradient-to-r from-white via-emerald-100 to-teal-200">
                                            解析用リファレンスシート

                                    </div>
                                    <div className="text-right">
                                        <p className="text-[9px] text-emerald-300 font-mono-code tracking-widest bg-slate-800/80 px-2.5 py-1 rounded border border-emerald-500/30">KEEP ON DESK</p>
                                    </div>
                                </div>
                            </header>

                            {/* ⬜ メインコンテンツ */}
                            <div className="flex-1 px-6 pt-4 pb-0 flex flex-col bg-slate-50 relative z-10 min-h-0">
                                
                                {/* 🔴 1. アミノ酸の性質一覧 */}

                                        <div className="w-5 h-5 bg-indigo-100 text-indigo-600 rounded flex items-center justify-center font-black text-xs">1</div>

                                                    <th className="py-1 px-3 font-bold border-b border-slate-300 w-[50%]">特徴（水溶液中での振る舞い）</th>

                                                    <th className="py-1 px-3 font-bold border-b border-slate-300 text-center w-[8%]">1文字</th>

                                            </thead>
                                            <tbody className="text-[10px] leading-tight">
                                                {/* 非極性 */}
                                                <tr className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                                                    <td className="py-3 px-3 align-top">
                                                        <div className="bg-amber-100 text-amber-800 font-bold px-1 py-0.5 rounded text-center border border-amber-200 shadow-sm leading-tight text-[8px] mt-1">
                                                            非極性<br/><span className="text-[7.5px]">(疎水性)</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-3 px-3 align-top text-slate-600 leading-snug">
                                                        水を嫌う。水溶液中ではタンパク質の<span className="font-bold text-amber-700 bg-amber-50 px-1 rounded">内側</span>に折りたたまれて隠れようとする（疎水性コアの形成）。
                                                    </td>
                                                    <td className="py-3 px-3 align-top font-medium text-slate-700">
                                                        グリシン<br/>アラニン<br/>バリン<br/>ロイシン<br/>イソロイシン<br/>メチオニン<br/>プロリン<br/>フェニルアラニン<br/>トリプトファン
                                                    </td>
                                                    <td className="py-3 px-3 align-top text-center font-mono-code text-slate-500">
                                                        Gly<br/>Ala<br/>Val<br/>Leu<br/>Ile<br/>Met<br/>Pro<br/>Phe<br/>Trp
                                                    </td>
                                                    <td className="py-3 px-3 align-top text-center font-mono-code font-bold text-slate-700">
                                                        G<br/>A<br/>V<br/>L<br/>I<br/>M<br/>P<br/>F<br/>W
                                                    </td>
                                                </tr>
                                                {/* 極性 */}
                                                <tr className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                                                    <td className="py-1.5 px-3 align-top">
                                                        <div className="bg-emerald-100 text-emerald-800 font-bold px-1 py-0.5 rounded text-center border border-emerald-200 shadow-sm leading-tight text-[8px] mt-1">
                                                            極性・無電荷<br/><span className="text-[7.5px]">(親水性)</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-1.5 px-3 align-top text-slate-600 leading-snug">
                                                        水と水素結合を作りやすい。タンパク質の<span className="font-bold text-emerald-700 bg-emerald-50 px-1 rounded">表面</span>に存在することが多い。
                                                    </td>
                                                    <td className="py-1.5 px-3 align-top font-medium text-slate-700">
                                                        セリン<br/>トレオニン<br/>チロシン<br/>システイン<br/>アスパラギン<br/>グルタミン
                                                    </td>
                                                    <td className="py-1.5 px-3 align-top text-center font-mono-code text-slate-500">
                                                        Ser<br/>Thr<br/>Tyr<br/>Cys<br/>Asn<br/>Gln
                                                    </td>
                                                    <td className="py-1.5 px-3 align-top text-center font-mono-code font-bold text-slate-700">
                                                        S<br/>T<br/>Y<br/>C<br/>N<br/>Q
                                                    </td>
                                                </tr>
                                                {/* 酸性 */}
                                                <tr className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                                                    <td className="py-1.5 px-2 align-top">
                                                        <div className="bg-rose-100 text-rose-800 font-bold px-1 py-0.5 rounded text-center border border-rose-200 shadow-sm leading-tight text-[8px] mt-1">
                                                            酸性<br/><span className="text-[7.5px]">(親水・負電荷)</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top text-slate-600 leading-snug">
                                                        水溶液中でマイナス(−)の電気を帯びる。水と非常によくなじむ。
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top font-medium text-slate-700">
                                                        アスパラギン酸<br/>グルタミン酸
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top text-center font-mono-code text-slate-500">
                                                        Asp<br/>Glu
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top text-center font-mono-code font-bold text-slate-700">
                                                        D<br/>E
                                                    </td>
                                                </tr>
                                                {/* 塩基性 */}
                                                <tr className="hover:bg-slate-50 transition-colors">
                                                    <td className="py-1.5 px-2 align-top">
                                                        <div className="bg-blue-100 text-blue-800 font-bold px-1.5 py-1 rounded text-center border border-blue-200 shadow-sm leading-tight text-[8px] mt-1">
                                                            塩基性<br/><span className="text-[7.5px]">(親水・正電荷)</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top text-slate-600 leading-snug">
                                                        水溶液中でプラス(＋)の電気を帯びる。DNAなどと結合しやすい。
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top font-medium text-slate-700">
                                                        リシン<br/>アルギニン<br/>ヒスチジン
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top text-center font-mono-code text-slate-500">
                                                        Lys<br/>Arg<br/>His
                                                    </td>
                                                    <td className="py-1.5 px-2 align-top text-center font-mono-code font-bold text-slate-700">
                                                        K<br/>R<br/>H
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </section>

                                {/* 🔵 2. コドン早見表 */}
                                <section className="shrink-0 flex flex-col min-h-0">
                                    <div className="flex items-center gap-1.5 mb-1 border-b-2 border-slate-200 pb-1 shrink-0">
                                        <div className="w-5 h-5 bg-teal-100 text-teal-600 rounded flex items-center justify-center font-black text-xs">2</div>
                                        <h2 className="text-[13.5px] font-bold text-slate-800 tracking-tight">遺伝暗号（コドン）早見表 <span className="text-[10px] font-normal text-slate-500">（mRNA → アミノ酸）</span></h2>
                                    </div>
                                    <p className="text-[9px] text-slate-600 mb-1 font-medium shrink-0">
                                        ※表の左側がmRNAの第1塩基、上側が第2塩基、右側が第3塩基です。開始コドン（AUG）は、タンパク質合成の開始点（メチオニン）です。
                                    </p>

                                    <div className="overflow-hidden border border-slate-300 rounded-lg shadow-sm bg-white">
                                        <table className="w-full text-center border-collapse">
                                            <thead>
                                                <tr className="bg-slate-800 text-white text-[9.5px] font-bold">
                                                    <th className="py-1 border-r border-slate-600 w-[8%]">第1塩基</th>
                                                    <th className="py-1 border-r border-slate-600 w-[21%]">第2塩基: U</th>
                                                    <th className="py-1 border-r border-slate-600 w-[21%]">第2塩基: C</th>
                                                    <th className="py-1 border-r border-slate-600 w-[21%]">第2塩基: A</th>
                                                    <th className="py-1 border-r border-slate-600 w-[21%]">第2塩基: G</th>
                                                    <th className="py-1 w-[8%]">第3塩基</th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-[9px] font-mono-code leading-normal">
                                                {/* U */}
                                                <tr className="border-b border-slate-300">
                                                    <td className="bg-slate-100 font-black text-[11px] border-r border-slate-300 text-slate-700">U</td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        UUU (Phe/F)<br/>UUC (Phe/F)<br/>UUA (Leu/L)<br/>UUG (Leu/L)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        UCU (Ser/S)<br/>UCC (Ser/S)<br/>UCA (Ser/S)<br/>UCG (Ser/S)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        UAU (Tyr/Y)<br/>UAC (Tyr/Y)<br/><span className="text-rose-600 font-bold bg-rose-50 px-0.5 rounded">UAA (終止)</span><br/><span className="text-rose-600 font-bold bg-rose-50 px-0.5 rounded">UAG (終止)</span>
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        UGU (Cys/C)<br/>UGC (Cys/C)<br/><span className="text-rose-600 font-bold bg-rose-50 px-0.5 rounded">UGA (終止)</span><br/>UGG (Trp/W)
                                                    </td>
                                                    <td className="bg-slate-50 font-bold text-slate-500 text-[8px]">
                                                        U<br/>C<br/>A<br/>G
                                                    </td>
                                                </tr>
                                                {/* C */}
                                                <tr className="border-b border-slate-300">
                                                    <td className="bg-slate-100 font-black text-[11px] border-r border-slate-300 text-slate-700">C</td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        CUU (Leu/L)<br/>CUC (Leu/L)<br/>CUA (Leu/L)<br/>CUG (Leu/L)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        CCU (Pro/P)<br/>CCC (Pro/P)<br/>CCA (Pro/P)<br/>CCG (Pro/P)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        CAU (His/H)<br/>CAC (His/H)<br/>CAA (Gln/Q)<br/>CAG (Gln/Q)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        CGU (Arg/R)<br/>CGC (Arg/R)<br/>CGA (Arg/R)<br/>CGG (Arg/R)
                                                    </td>
                                                    <td className="bg-slate-50 font-bold text-slate-500 text-[8px]">
                                                        U<br/>C<br/>A<br/>G
                                                    </td>
                                                </tr>
                                                {/* A */}
                                                <tr className="border-b border-slate-300">
                                                    <td className="bg-slate-100 font-black text-[11px] border-r border-slate-300 text-slate-700">A</td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        AUU (Ile/I)<br/>AUC (Ile/I)<br/>AUA (Ile/I)<br/><span className="text-teal-600 font-bold bg-teal-50 px-0.5 rounded border border-teal-200 shadow-sm relative"><i data-lucide="star" className="w-2 h-2 absolute -left-2 top-0.5 fill-teal-500 text-teal-500"></i>AUG (Met/M)</span>
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        ACU (Thr/T)<br/>ACC (Thr/T)<br/>ACA (Thr/T)<br/>ACG (Thr/T)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        AAU (Asn/N)<br/>AAC (Asn/N)<br/>AAA (Lys/K)<br/>AAG (Lys/K)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        AGU (Ser/S)<br/>AGC (Ser/S)<br/>AGA (Arg/R)<br/>AGG (Arg/R)
                                                    </td>
                                                    <td className="bg-slate-50 font-bold text-slate-500 text-[8px]">
                                                        U<br/>C<br/>A<br/>G
                                                    </td>
                                                </tr>
                                                {/* G */}
                                                <tr>
                                                    <td className="bg-slate-100 font-black text-[11px] border-r border-slate-300 text-slate-700 rounded-bl-lg">G</td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        GUU (Val/V)<br/>GUC (Val/V)<br/>GUA (Val/V)<br/>GUG (Val/V)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        GCU (Ala/A)<br/>GCC (Ala/A)<br/>GCA (Ala/A)<br/>GCG (Ala/A)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        GAU (Asp/D)<br/>GAC (Asp/D)<br/>GAA (Glu/E)<br/>GAG (Glu/E)
                                                    </td>
                                                    <td className="py-3 border-r border-slate-200">
                                                        GGU (Gly/G)<br/>GGC (Gly/G)<br/>GGA (Gly/G)<br/>GGG (Gly/G)
                                                    </td>
                                                    <td className="bg-slate-50 font-bold text-slate-500 text-[8.5px] leading-normal rounded-br-lg">
                                                        U<br/>C<br/>A<br/>G
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </section>

                                {/* 💡 【追加コラム】 */}
                                <section className="shrink-0 flex flex-col mt-auto mb-3">
                                    <div className="bg-slate-900 text-white rounded-xl p-2.5 border-l-4 border-cyan-500 flex flex-col shadow-md">
                                        <h3 className="text-[9.5px] font-black text-cyan-400 mb-1 flex items-center gap-1.5">
                                            <i data-lucide="help-circle" className="w-3.5 h-3.5"></i> データベースの表記ルール：コドン表（AUG）とDNA配列（ATG）の関係性
                                        </h3>
                                        <p className="text-[8px] text-slate-300 leading-tight mb-2">
                                            NCBIやアライメント画面に表示されているのは、DNAの2本鎖のうち転写に読まれる「鋳型鎖（アンチセンス鎖）」ではなく、相補的な<strong>「非鋳型鎖（センス鎖）」</strong>を5'➡3'方向で表したものです。これは、配列の「T」を「U」に置き換えるだけで、そのままmRNA（コドン）と同じアミノ酸配列情報を示すためです。
                                        </p>
                                        <div className="grid grid-cols-3 gap-2.5 text-center text-[8.5px] font-mono-code bg-slate-800/80 p-2 rounded border border-slate-700">
                                            <div className="border-r border-slate-700">
                                                <div className="text-cyan-400 font-bold text-[8px]">DNA (非鋳型鎖/センス鎖)</div>
                                                <div className="text-white mt-0.5">5' - <span className="bg-cyan-900/50 px-1.5 py-0.5 font-bold text-cyan-200 rounded">ATG</span> - 3'</div>
                                                <div className="text-[7px] text-slate-400 mt-0.5">※画面表示はコレ！</div>
